<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - SmartPJU Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#4a9eff",
              dark: {
                100: "#1a1f2e",
                200: "#0f1419",
              },
              light: {
                100: "#f5f7fa",
                200: "#e4e9f0",
              },
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .status-dot-pulse {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
      }

      @layer components {
        .stat-card {
          @apply bg-dark-100/80 border border-white/10 rounded-xl p-4 sm:p-6 
                 transition-all hover:shadow-xl hover:shadow-primary/10;
        }

        .stat-icon {
          @apply text-2xl sm:text-3xl text-primary;
        }

        .stat-title {
          @apply text-gray-400 text-xs sm:text-sm font-normal;
        }

        .stat-value {
          @apply text-white text-2xl sm:text-3xl font-semibold mt-2;
        }

        .stat-subtitle {
          @apply text-gray-400 text-xs sm:text-sm mt-1;
        }
      }

      /* Smooth scrolling */
      html {
        scroll-behavior: smooth;
      }

      /* Performance optimization */
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Chart container responsive */
      .chart-container {
        position: relative;
        width: 100%;
        height: 300px;
      }

      @media (min-width: 640px) {
        .chart-container {
          height: 350px;
        }
      }

      @media (min-width: 768px) {
        .chart-container {
          height: 400px;
        }
      }

      @media (min-width: 1024px) {
        .chart-container {
          height: 450px;
        }
      }

      /* Reduce animations on scroll */
      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /* Light theme styles */
      .light body {
        @apply bg-gradient-to-br from-gray-50 via-white to-gray-100 text-gray-900;
      }

      .light nav,
      .light aside,
      .light #hamburger-btn {
        @apply bg-white/95 border-gray-200;
      }

      .light .bg-dark-100\/80,
      .light .bg-white\/5 {
        @apply bg-white shadow-md;
      }

      .light .bg-dark-200\/95,
      .light .bg-dark-200 {
        @apply bg-white/95;
      }

      .light .text-gray-400 {
        @apply text-gray-600;
      }

      .light .text-gray-200,
      .light .text-white {
        @apply text-gray-900;
      }

      .light .border-white\/10 {
        @apply border-gray-200;
      }

      .light #hamburger-btn span {
        @apply bg-primary;
      }

      .light select {
        @apply bg-gray-100 text-gray-900 border-gray-300;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-br from-dark-200 via-dark-100 to-dark-200 min-h-screen text-gray-200 transition-colors duration-300"
  >
    <!-- Navbar -->
    <nav
      class="fixed top-0 left-0 right-0 z-50 bg-dark-100/95 backdrop-blur-md border-b border-white/10"
    >
      <div class="w-full px-3 sm:px-4 lg:container lg:mx-auto">
        <div class="flex items-center justify-between h-16">
          <!-- Left side - Hamburger + Logo -->
          <div class="flex items-center gap-2 sm:gap-3 lg:gap-4">
            <button
              class="lg:hidden bg-white/5 border border-white/10 rounded-lg p-2 hover:bg-primary/20 hover:border-primary transition-all"
              id="hamburger-btn"
            >
              <div class="w-5 h-4 flex flex-col justify-between">
                <span
                  class="block w-full h-0.5 bg-primary rounded transition-all duration-300"
                ></span>
                <span
                  class="block w-full h-0.5 bg-primary rounded transition-all duration-300"
                ></span>
                <span
                  class="block w-full h-0.5 bg-primary rounded transition-all duration-300"
                ></span>
              </div>
            </button>

            <!-- Logos -->
            <img
              src="{{ url_for('static', filename='img/PENS-LOGO.png') }}"
              alt="PENS Logo"
              class="h-8 sm:h-9 lg:h-10 w-auto"
            />
            <img
              src="{{ url_for('static', filename='img/pemkot.png') }}"
              alt="Pemkot Logo"
              class="h-8 sm:h-9 lg:h-10 w-auto"
            />
            <div class="hidden md:block">
              <h1 class="text-white text-lg font-semibold">SmartPJU Monitor</h1>
              <p class="text-gray-400 text-xs">
                Vehicle Traffic Detection System
              </p>
            </div>
          </div>

          <!-- Right side - Theme Toggle -->
          <div class="flex items-center">
            <button
              id="theme-toggle"
              class="p-2 sm:p-2.5 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 hover:border-primary transition-all"
              title="Toggle Theme"
            >
              <i
                class="bi bi-sun-fill text-lg sm:text-xl text-yellow-400 hidden"
                id="light-icon"
              ></i>
              <i
                class="bi bi-moon-stars-fill text-lg sm:text-xl text-blue-400"
                id="dark-icon"
              ></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Sidebar Overlay -->
    <div
      class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden"
      id="sidebar-overlay"
    ></div>

    <div class="flex min-h-screen">
      <!-- Sidebar -->
      <aside
        class="fixed lg:static w-64 h-screen bg-dark-200/95 border-r border-white/10 py-8 pt-20 lg:pt-20 z-40 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto"
        id="sidebar"
      >
        <div class="px-6 mb-8 flex items-center gap-3">
          <img
            src="{{ url_for('static', filename='img/Logo Si PJU.png') }}"
            alt="Logo PJU"
            class="h-8 w-auto"
          />
          <h4 class="text-white text-xl font-semibold">SmartPJU Monitor</h4>
        </div>
        <ul class="space-y-2">
          <li>
            <a
              href="/"
              class="flex items-center gap-4 px-6 py-3.5 bg-primary/15 text-primary border-l-3 border-primary"
            >
              <i class="bi bi-grid-fill text-xl w-6"></i>
              <span>Dashboard</span>
            </a>
          </li>
          <li>
            <a
              href="/cctv"
              class="flex items-center gap-4 px-6 py-3.5 text-gray-400 hover:bg-primary/10 hover:text-primary transition-all border-l-3 border-transparent hover:border-primary"
            >
              <i class="bi bi-camera-video-fill text-xl w-6"></i>
              <span>CCTV</span>
            </a>
          </li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="flex-1 p-3 pt-20 sm:p-6 sm:pt-24 lg:p-8 lg:pt-24 lg:ml-0">
        <!-- Page Header -->
        <div class="mb-6">
          <h1 class="text-2xl sm:text-3xl font-semibold text-white mb-2">
            Dashboard
          </h1>
          <p class="text-gray-400 text-sm sm:text-base">
            Statistik dan monitoring kendaraan secara real-time
          </p>
        </div>

        <!-- Vehicle Count Cards Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 sm:gap-6 mb-6">
          <!-- Car Count -->
          <div class="stat-card">
            <div class="flex items-center justify-between">
              <div>
                <div class="stat-title">MOBIL (CAR)</div>
                <div
                  class="text-white text-3xl sm:text-4xl font-bold mt-2"
                  id="car-count"
                >
                  0
                </div>
                <div class="stat-subtitle">Total kendaraan hari ini</div>
              </div>
              <i class="bi bi-car-front text-5xl text-blue-400"></i>
            </div>
          </div>

          <!-- Motorcycle Count -->
          <div class="stat-card">
            <div class="flex items-center justify-between">
              <div>
                <div class="stat-title">MOTOR (MOTORCYCLE)</div>
                <div
                  class="text-white text-3xl sm:text-4xl font-bold mt-2"
                  id="motorcycle-count"
                >
                  0
                </div>
                <div class="stat-subtitle">Total kendaraan hari ini</div>
              </div>
              <i class="bi bi-bicycle text-5xl text-green-400"></i>
            </div>
          </div>

          <!-- Truck Count -->
          <div class="stat-card">
            <div class="flex items-center justify-between">
              <div>
                <div class="stat-title">TRUK (TRUCK)</div>
                <div
                  class="text-white text-3xl sm:text-4xl font-bold mt-2"
                  id="truck-count"
                >
                  0
                </div>
                <div class="stat-subtitle">Total kendaraan hari ini</div>
              </div>
              <i class="bi bi-truck text-5xl text-orange-400"></i>
            </div>
          </div>
        </div>

        <!-- Vehicle Chart Full Width -->
        <div class="stat-card">
          <div
            class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-4"
          >
            <h6 class="text-white text-lg font-semibold">Grafik Kendaraan</h6>
            <select
              id="chart-time-range"
              class="bg-dark-200 text-white text-sm px-3 py-2 rounded border border-white/10 w-full sm:w-auto"
            >
              <option value="0.17">10 Menit</option>
              <option value="0.5">30 Menit</option>
              <option value="1">1 Jam</option>
              <option value="3">3 Jam</option>
              <option value="6" selected>6 Jam</option>
              <option value="12">12 Jam</option>
              <option value="24">24 Jam</option>
            </select>
          </div>
          <div class="chart-container">
            <canvas id="vehicleChart"></canvas>
          </div>
        </div>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  </body>
</html>
