version: "3.8"

services:
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${INFLUXDB_INIT_MODE:-setup}
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_INIT_USERNAME:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_INIT_PASSWORD:-password123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG:-myorg}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET:-vehicle_counting}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_ADMIN_TOKEN:-mytoken123}
      - INFLUXDB_HTTP_CORS_ENABLED=true
      - INFLUXDB_HTTP_CORS_ORIGINS=*
    volumes:
      - ./influxdb-data:/var/lib/influxdb2
    networks:
      - monitoring

  webserver:
    build:
      context: .
      dockerfile: Dockerfile.webserver
    container_name: webserver
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_INIT_ADMIN_TOKEN:-mytoken123}
      - INFLUXDB_INIT_ORG=${INFLUXDB_INIT_ORG:-myorg}
      - INFLUXDB_INIT_BUCKET=${INFLUXDB_INIT_BUCKET:-vehicle_counting}
      - LOCATION_NAME=${LOCATION_NAME:-camera1}
    volumes:
      - ./output:/app/output
      - ./webserver:/app/webserver
    networks:
      - monitoring
    depends_on:
      - influxdb
networks:
  monitoring:
